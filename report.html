<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laporan Rekapitulasi Petugas Natal 2026</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container report-container">
    <div class="banner-container">
      <img src="banner.png" alt="Banner Natal 2026" width="900" height="280" class="banner-img">
    </div>

    <h1>REKAPITULASI JADWAL PETUGAS NATAL 2026</h1>
    <p class="greeting" style="text-align: center;">
      Daftar nama petugas yang terdaftar pada Rangkaian Kegiatan Natal 2026 Paroki Katedral, dikelompokkan berdasarkan jadwal event dan Seksi/Kelompok.
    </p>

    <div class="report-controls">
      <button type="button" class="btn-action" onclick="toggleAllAccordions(true)">Buka Semua</button>
      <button type="button" class="btn-action" onclick="toggleAllAccordions(false)">Tutup Semua</button>
      <button type="button" class="btn-action btn-reload" onclick="fetchReportData()">Refresh Data</button>
    </div>

    <div id="reportAccordionContainer" class="accordion-container">
      <p class="loading-text">Memuat rekapitulasi data petugas...</p>
    </div>
  </div>

  <script src="report.js"></script>
</body>
</html>
